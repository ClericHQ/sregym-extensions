# Cleric reads Loki through Grafana: one Loki datasource, and a Viewer service-account token made by install.sh.
persistence:
  enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observe.svc.cluster.local:3100
        isDefault: true
